<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <rect width="800" height="320" fill="#0B0F17" rx="12" stroke="#1E293B" stroke-width="2"/>
  <defs>
    <linearGradient id="apex-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Ingestion Edge -->
  <g transform="translate(40, 100)">
    <rect width="180" height="110" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Edge API Gateway</text>
    <text x="90" y="70" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">HMAC-SHA256 Auth</text>
    <circle cx="90" cy="90" r="4" fill="#22C55E"/>
  </g>
  <!-- Arrow 1 -->
  <path d="M 225 155 L 295 155" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="295,150 305,155 295,160" fill="#F97316"/>
  <!-- Redis Stream Buffer -->
  <g transform="translate(310, 100)">
    <rect width="180" height="110" rx="8" fill="#111827" stroke="#F97316" stroke-width="1.5"/>
    <text x="90" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Redis Stream Buffer</text>
    <text x="90" y="70" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Sub-ms Memory Queue</text>
    <text x="90" y="90" fill="#F97316" font-family="monospace" font-size="10" text-anchor="middle">Consumer Groups</text>
  </g>
  <!-- Arrow 2 -->
  <path d="M 495 155 L 565 155" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="565,150 575,155 565,160" fill="#F97316"/>
  <!-- Storage & Compaction Tier -->
  <g transform="translate(580, 100)">
    <rect width="180" height="110" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Partitioned PostgreSQL</text>
    <text x="90" y="70" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Micro-batch Worker Pool</text>
    <text x="90" y="90" fill="#22C55E" font-family="monospace" font-size="10" text-anchor="middle">Automated Compaction</text>
  </g>
  <!-- Header Title -->
  <text x="40" y="50" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1">SYSTEM ARCHITECTURE // APEX TELEMETRY GATEWAY</text>
</svg>
