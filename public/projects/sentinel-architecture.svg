<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <rect width="800" height="320" fill="#0B0F17" rx="12" stroke="#1E293B" stroke-width="2"/>
  <!-- Root Authority -->
  <g transform="translate(50, 100)">
    <rect width="180" height="110" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Root Auth Service</text>
    <text x="90" y="70" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Ed25519 Key Issuer</text>
    <text x="90" y="90" fill="#F97316" font-family="monospace" font-size="10" text-anchor="middle">7-Day Rotation</text>
  </g>
  <!-- Arrow 1 -->
  <path d="M 235 155 L 305 155" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="305,150 315,155 305,160" fill="#F97316"/>
  <!-- Edge Validation Layer -->
  <g transform="translate(320, 100)">
    <rect width="180" height="110" rx="8" fill="#111827" stroke="#F97316" stroke-width="1.5"/>
    <text x="90" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Local JWKS Cache</text>
    <text x="90" y="70" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Zero-Network Verification</text>
    <text x="90" y="90" fill="#22C55E" font-family="monospace" font-size="10" text-anchor="middle">&lt; 1.2ms Verification</text>
  </g>
  <!-- Arrow 2 -->
  <path d="M 505 155 L 575 155" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="575,150 585,155 575,160" fill="#F97316"/>
  <!-- Distributed Revocation -->
  <g transform="translate(590, 100)">
    <rect width="160" height="110" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="80" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Bloom Filter Mesh</text>
    <text x="80" y="70" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Redis Pub/Sub Sync</text>
    <text x="80" y="90" fill="#22C55E" font-family="monospace" font-size="10" text-anchor="middle">Sub-50ms Invalidation</text>
  </g>
  <text x="50" y="50" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1">DISTRIBUTED AUTH MESH // ARCHITECTURE SPECIFICATION</text>
</svg>
